# Underglow · fzf
# Install: copy to ~/.config/fzf/fzf.conf, or point FZF_DEFAULT_OPTS_FILE at this file.

# Every colour key supported by this fzf (verified against man fzf, fzf 0.74.5).
--color=fg:#C6CADF,list-fg:#C6CADF,selected-fg:#E7EAF6,preview-fg:#C6CADF,bg:#0B0D14,list-bg:#0B0D14,selected-bg:#2A2F47,preview-bg:#12141F,input-bg:#0B0D14,header-bg:#0B0D14,footer-bg:#0B0D14,hl:#9D8CFF,selected-hl:#C3BAFF,current-fg:#E7EAF6,current-bg:#2A2F47,current-hl:#9D8CFF,alt-bg:#12141F,alt-gutter:#12141F,gutter:#0B0D14,border:#191C2A,list-border:#191C2A,preview-border:#191C2A,input-border:#191C2A,header-border:#191C2A,footer-border:#191C2A,label:#98A0B8,list-label:#98A0B8,preview-label:#98A0B8,input-label:#98A0B8,header-label:#4C8DF6,footer-label:#98A0B8,prompt:#9D8CFF,pointer:#4C8DF6,marker:#C26BE8,spinner:#35B6D8,query:#E7EAF6,ghost:#646C88,disabled:#646C88,nomatch:#E2515F,info:#646C88,separator:#191C2A,gap-line:#191C2A,scrollbar:#191C2A,preview-scrollbar:#191C2A,header:#4C8DF6,footer:#98A0B8

--layout=reverse               # prompt at the top, matches listed below
--height=60%                   # use at most 60% of the terminal
--info=inline-right            # match counter on the right of the prompt line
--border=rounded               # rounded window frame
--border-label=" underglow "    # frame label
--marker="›"                   # multi-select marker
--pointer="❯"                  # current-line pointer
