  crypto: {foreground: "#4C8DF6"}
  document: {foreground: "#C6CADF"}
  compressed: {foreground: "#C26BE8"}
  temp: {foreground: "#E2515F"}
  compiled: {foreground: "#4C8DF6"}
  source: {foreground: "#35B6D8"}

punctuation: {foreground: "#646C88"}
