  special_other: {foreground: "#646C88"}
  attribute: {foreground: "#4C8DF6"}

size:
  major: {foreground: "#C26BE8"}
  minor: {foreground: "#4C8DF6"}
  number_byte: {foreground: "#C6CADF"}
  number_kilo: {foreground: "#35B6D8"}
  number_mega: {foreground: "#4C8DF6"}
  number_giga: {foreground: "#C26BE8"}
  number_huge: {foreground: "#E2515F"}
  unit_byte: {foreground: "#B9BED4"}
  unit_kilo: {foreground: "#4C8DF6"}
  unit_mega: {foreground: "#35B6D8"}
  unit_giga: {foreground: "#4C8DF6"}
  unit_huge: {foreground: "#E2515F"}

users:
  user_you: {foreground: "#646C88"}
  user_root: {foreground: "#E2515F"}
  user_other: {foreground: "#646C88"}
