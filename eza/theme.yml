colourful: true

filekinds:
  normal: {foreground: "#C6CADF"}
  directory: {foreground: "#4C8DF6"}
  symlink: {foreground: "#35B6D8"}
  pipe: {foreground: "#B9BED4"}
  block_device: {foreground: "#E0A93C"}
  char_device: {foreground: "#E0A93C"}
  socket: {foreground: "#B9BED4"}
  special: {foreground: "#C26BE8"}
  executable: {foreground: "#45C2A0"}
  mount_point: {foreground: "#35B6D8"}

perms:
  user_read: {foreground: "#E0A93C", is_bold: true}
  user_write: {foreground: "#E2515F", is_bold: true}
  user_execute_file: {foreground: "#45C2A0", is_bold: true}
  user_execute_other: {foreground: "#45C2A0", is_bold: true}
  group_read: {foreground: "#E0A93C"}
  group_write: {foreground: "#E2515F"}
  group_execute: {foreground: "#45C2A0"}
  other_read: {foreground: "#E0A93C"}
