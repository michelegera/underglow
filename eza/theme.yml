  group_other: {foreground: "#646C88"}
  group_root: {foreground: "#E2515F"}

links:
  normal: {foreground: "#35B6D8"}
  multi_link_file: {foreground: "#4C8DF6"}

git:
  new: {foreground: "#45C2A0"}
  modified: {foreground: "#E0A93C"}
  deleted: {foreground: "#E2515F"}
  renamed: {foreground: "#4C8DF6"}
  typechange: {foreground: "#C26BE8"}
  ignored: {foreground: "#646C88"}
  conflicted: {foreground: "#E2515F"}

